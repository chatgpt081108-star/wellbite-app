<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Wellbite social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f120e" stop-opacity="1" />
      <stop offset="1" stop-color="#5d4037" stop-opacity="1" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- soft shape -->
  <g transform="translate(60,60)" filter="url(#f1)">
    <rect x="0" y="0" width="1080" height="510" rx="28" fill="#FFFFFF" fill-opacity="0.06" />
  </g>

  <!-- Left icon block -->
    <g transform="translate(120,170)">
    <rect x="0" y="0" width="220" height="220" rx="28" fill="#201814" />
    <g transform="translate(110,110)" text-anchor="middle" fill="#5d4037">
      <circle r="54" fill="#3e2723" />
      <g transform="translate(-18,-6)" font-family="Segoe UI Emoji, Noto Color Emoji, Apple Color Emoji, sans-serif" font-size="48"> 
        <text>🍎</text>
      </g>
    </g>
  </g>

  <!-- Title + subtitle -->
  <g transform="translate(360,220)" fill="#fffaf0" font-family="Noto Sans KR, Arial, sans-serif">
    <text x="0" y="0" font-size="48" font-weight="700">Wellbite</text>
    <text x="0" y="62" font-size="20" fill-opacity="0.92">따뜻한 선택으로 몸과 마음을 지켜요</text>
    <rect x="0" y="92" width="640" height="2" rx="1" fill="#ffffff" fill-opacity="0.12" />

    <text x="0" y="140" font-size="18" fill-opacity="0.95">사진을 올리면 아이 식습관의 신체 · 정서 · 학습 영향을 안내합니다.</text>
  </g>

  <!-- right small badges -->
  <g transform="translate(360,360)" font-family="Noto Sans KR, Arial, sans-serif" fill="#fffaf0">
    <rect x="0" y="0" width="220" height="40" rx="10" fill="#ffffff" fill-opacity="0.06" />
    <text x="20" y="26" font-size="16">AI 분석 · 교육 현장용</text>
  </g>

  <!-- subtle copyright -->
  <text x="1100" y="610" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#fffaf0" fill-opacity="0.6" text-anchor="end">Wellbite</text>
  
</svg>
